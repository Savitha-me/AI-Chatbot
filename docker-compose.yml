version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: enterprise_postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: savi@123
      POSTGRES_DB: enterprise_ai
    ports:
      "5432:5432"

    volumes:
      postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4

    container_name: edi_pgadmin

    restart: always

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@enterprise.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
     "5050:80"

    depends_on:
      postgres

  qdrant:
    image: qdrant/qdrant:latest
    container_name: enterprise_qdrant

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      qdrant_data:/qdrant/storage
  
  volumes:
    postgres_data:

    qdrant_data: